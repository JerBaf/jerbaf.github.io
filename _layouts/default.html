<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/roboto-latin-300-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </head>
  <body>
    {% include header.html %}
    <main class="container">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container">
        &copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.last_name }}.
        Design adapted from <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
      </div>
    </footer>
  </body>
</html>
